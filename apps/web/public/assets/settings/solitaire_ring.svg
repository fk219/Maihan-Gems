<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ringBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldShank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C0"/>
      <stop offset="35%" stop-color="#E8C96A"/>
      <stop offset="70%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="gemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E0E7FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#8b6914" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#ringBg)"/>

  <g filter="url(#ringShadow)">
    <!-- Ring Band (Circular Shank with 3D profile) -->
    <ellipse cx="200" cy="235" rx="105" ry="105" fill="none" stroke="url(#goldShank)" stroke-width="22"/>
    <ellipse cx="200" cy="235" rx="94" ry="94" fill="none" stroke="#8B6914" stroke-width="2" opacity="0.4"/>
    <ellipse cx="200" cy="235" rx="116" ry="116" fill="none" stroke="#FFFBEB" stroke-width="1.5" opacity="0.6"/>

    <!-- Head / Cathedral Shoulders -->
    <path d="M125 185 C145 150 170 130 185 125 L215 125 C230 130 255 150 275 185" fill="none" stroke="url(#goldShank)" stroke-width="16" stroke-linecap="round"/>

    <!-- 4-Prong Setting Crown / Collet -->
    <polygon points="160,95 240,95 225,130 175,130" fill="url(#goldShank)"/>
    <line x1="160" y1="95" x2="155" y2="70" stroke="url(#goldShank)" stroke-width="6" stroke-linecap="round"/>
    <line x1="240" y1="95" x2="245" y2="70" stroke="url(#goldShank)" stroke-width="6" stroke-linecap="round"/>
    <line x1="185" y1="95" x2="180" y2="68" stroke="url(#goldShank)" stroke-width="5" stroke-linecap="round"/>
    <line x1="215" y1="95" x2="220" y2="68" stroke="url(#goldShank)" stroke-width="5" stroke-linecap="round"/>

    <!-- Solitaire Brilliant Gemstone Placeholder Silhouette -->
    <polygon points="160,70 240,70 200,120" fill="url(#gemGlow)"/>
    <polygon points="175,55 225,55 240,70 160,70" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
