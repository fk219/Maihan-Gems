# Maihan Gems — CI.
#
# Phase 1 Task 5: schema fidelity becomes a blocking check.
# INITIAL_IMPLEMENTATION_PLAN.md section 36 task 5:
#   "Assert schema fidelity in CI: 74 tables, 33 enums, 94 FKs, 591 CHECK,
#    263 indexes, 9 named invariant constraints, 6 RLS policies with
#    0 policy-less tables, 2 HNSW indexes, 1 trigger, 1 view, 2 functions."
#
# Sequence per the task contract: provision the disposable local PostgreSQL 16
# (the committed compose.yaml — no other infrastructure mechanism), apply the
# complete ordered migration chain on a FRESH scratch database created by the
# orchestrator, run the framework-free schema-fidelity assertion, and exit
# non-zero on any mismatch.
#
# Never points at production or the shared Neon development database: the
# DATABASE_URL used here is the documented local throwaway endpoint
# (compose.yaml binds 127.0.0.1:5433 inside the runner), and the orchestrator
# refuses Neon hosts outright.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    name: lint, build, schema fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Disposable local PostgreSQL 16 with every required extension
      # (pgvector/pgvector:pg16). --wait blocks until the healthcheck passes.
      - name: Start disposable PostgreSQL 16
        run: docker compose up -d --wait db

      - name: Lint
        run: pnpm run lint

      # SG-7 / M-10: dependency-free secret scan over git-tracked files.
      # The local dev fixture credentials published in compose.yaml are on the
      # documented allow-list; anything else fails the build.
      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      # SG-14: "No PII in logs, analytics or embeddings." Tripwire scan over
      # the runtime sources (tests excluded — they are the SG-14 proof).
      - name: PII scan
        run: node scripts/pii-scan.mjs

      - name: Build
        run: pnpm run build

      # Phase 4: the Next.js production build is a gate, not an afterthought.
      # `next build --webpack` needs no database — the catalogue routes are
      # `dynamic = 'force-dynamic'` and render on demand. This step is the
      # regression check for the `.js` -> `.ts` extension resolution fix in
      # apps/web/next.config.ts (Turbopack cannot do it; see that file).
      - name: Storefront production build
        run: pnpm --filter @maihan/web run build

      # Phase 4 Task 10: the SoT 12.11 initial-JS budgets (category <= 170 KB
      # gzip, product <= 190 KB gzip) enforced against the production build
      # just produced. Deterministic: chunk selection comes from the build's
      # own manifests (rootMainFiles + each route's client-reference
      # manifest) and sizes are gzip of the exact chunk bytes. A missing build
      # or missing chunk FAILS the check (fail closed, never skipped).
      # SoT 12.11's LCP p75 < 2.5 s is a real-user metric on staging and is
      # deliberately NOT claimed here; see the script's explicit output line.
      - name: Storefront performance budgets (SoT 12.11)
        run: pnpm --filter @maihan/web run check:budgets

      # ADR-021 ACCEPTED 2026-10-07: Vitest runs the unit/domain layer. Task 6
      # scope = packages/domain value objects + INV-01/02/03 predicates.
      # (Playwright/E2E is accepted but deliberately not run here.)
      - name: Domain unit tests
        run: pnpm --filter @maihan/domain run test

      # Phase 1 Task 9: reference-data seed gate — counts, values, uniqueness,
      # idempotency on a disposable scratch database (maihan_dev_seed) carved
      # from the local compose instance, always dropped. The local credential
      # Phase 3 task 8: OpenAPI is GENERATED from the committed Zod
      # contracts; this suite fails when the committed spec drifts from a
      # fresh generation (determinism + drift + fidelity). No database.
      - name: Contracts + OpenAPI drift gates
        run: pnpm --filter @maihan/contracts run test

      # Phase 13 remediation M-12: the remaining suites run in CI too — the AI
      # orchestrator/eval suites, the observability primitives, and the worker
      # dispatch/sweep suites (DB-gated; skip cleanly when the database is
      # unmigrated).
      - name: AI orchestrator and evaluation suites
        env:
          DATABASE_URL: postgresql://postgres:maihan_local_dev_only@127.0.0.1:5433/maihan_dev
        run: pnpm --filter @maihan/ai run test

      - name: Observability suite
        run: pnpm --filter @maihan/observability run test

      - name: Fresh API typecheck + lint
        run: |
          pnpm --filter @maihan/fresh-api exec tsc --noEmit
          pnpm exec eslint apps/fresh-api/src/

      - name: Stop disposable PostgreSQL 16
        if: always()
        run: docker compose down -v
