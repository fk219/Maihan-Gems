<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="stageGlow" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="45%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Diamond Core Glow -->
    <radialGradient id="diamondHalo" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#E2F1FF" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0E0E12" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground Shadow -->
    <radialGradient id="mirrorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#050508" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>

    <!-- Platinum 950 Gradients -->
    <linearGradient id="platBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="90%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="platHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.1"/>
    </linearGradient>

    <!-- 18K Yellow Gold Inner Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#B48222"/>
      <stop offset="100%" stop-color="#78500C"/>
    </linearGradient>

    <!-- Natural Diamond Radiant Facets Gradients -->
    <linearGradient id="facetPure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="facetPrismBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E0F2FE"/>
      <stop offset="85%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="facetPrismGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <linearGradient id="facetDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Sparkle Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Stage Canvas -->
  <rect width="1000" height="1000" fill="url(#stageGlow)"/>
  
  <!-- Optical Spotlight Behind Stone -->
  <circle cx="500" cy="390" r="320" fill="url(#diamondHalo)"/>

  <!-- Ground Mirror Shadow & Floor Reflection -->
  <ellipse cx="500" cy="740" rx="320" ry="45" fill="url(#mirrorShadow)"/>
  <ellipse cx="500" cy="735" rx="190" ry="22" fill="#000000" opacity="0.8"/>

  <!-- RING BAND (PLATINUM 950 + 18K GOLD UNDER-GALLERY) -->
  <g id="ringBandGroup">
    <!-- Back inner shank -->
    <ellipse cx="500" cy="560" rx="195" ry="160" fill="none" stroke="url(#goldAccent)" stroke-width="14" opacity="0.75"/>
    <ellipse cx="500" cy="560" rx="180" ry="145" fill="none" stroke="#1E293B" stroke-width="8"/>

    <!-- Front main shank (Architectural Double-Band Platinum 950) -->
    <path d="M 305,530 C 305,690 410,740 500,740 C 590,740 695,690 695,530" fill="none" stroke="url(#platBand)" stroke-width="32" stroke-linecap="round"/>
    <!-- Band Chamfer Highlight -->
    <path d="M 315,535 C 315,680 415,728 500,728 C 585,728 685,680 685,535" fill="none" stroke="url(#platHighlight)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Micro-Pavé Diamonds along shoulders -->
    <g id="paveShoulders" opacity="0.95">
      <circle cx="340" cy="530" r="5" fill="#FFFFFF"/>
      <circle cx="360" cy="565" r="5" fill="#FFFFFF"/>
      <circle cx="385" cy="600" r="5" fill="#FFFFFF"/>
      <circle cx="415" cy="630" r="5" fill="#FFFFFF"/>
      
      <circle cx="660" cy="530" r="5" fill="#FFFFFF"/>
      <circle cx="640" cy="565" r="5" fill="#FFFFFF"/>
      <circle cx="615" cy="600" r="5" fill="#FFFFFF"/>
      <circle cx="585" cy="630" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Architectural Gallery Prongs Base -->
    <path d="M 420,490 L 445,430 L 555,430 L 580,490 Z" fill="url(#platBand)" stroke="#334155" stroke-width="2"/>
    <path d="M 445,430 L 500,470 L 555,430" fill="none" stroke="url(#goldAccent)" stroke-width="5"/>
  </g>

  <!-- 2.15 CT RADIANT NATURAL DIAMOND (GEOMETRIC MASTER CUT) -->
  <g id="elysianDiamond" transform="translate(500, 380)">
    <!-- Pavilion & Depth Facets -->
    <polygon points="-130,-110 130,-110 90,80 -90,80" fill="url(#facetDeep)" opacity="0.8"/>
    
    <!-- Table & Crown Facets -->
    <!-- Main Table -->
    <polygon points="-75,-70 75,-70 65,40 -65,40" fill="url(#facetPure)" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Top & Side Step Facets (Blue & Gold Dispersion) -->
    <polygon points="-120,-115 -75,-70 75,-70 120,-115" fill="url(#facetPrismBlue)" stroke="#FFFFFF" stroke-width="1"/>
    <polygon points="-120,-115 -145,-90 -95,50 -65,40 -75,-70" fill="url(#facetPure)" stroke="#CBD5E1" stroke-width="1"/>
    <polygon points="120,-115 145,-90 95,50 65,40 75,-70" fill="url(#facetPrismGold)" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Bottom Step Facets -->
    <polygon points="-65,40 65,40 95,50 0,95 -95,50" fill="url(#facetPure)" stroke="#FFFFFF" stroke-width="1"/>
    <polygon points="0,95 65,40 95,50" fill="url(#facetPrismBlue)" stroke="#E2E8F0" stroke-width="1"/>
    <polygon points="0,95 -65,40 -95,50" fill="url(#facetPrismGold)" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Internal Star Facet Geometry (Brilliance Lines) -->
    <polygon points="0,-70 30,-25 0,20 -30,-25" fill="#FFFFFF" opacity="0.9" stroke="#E2E8F0" stroke-width="0.8"/>
    <polygon points="-75,-70 0,-70 -30,-25" fill="url(#facetPrismBlue)" opacity="0.7"/>
    <polygon points="75,-70 0,-70 30,-25" fill="url(#facetPrismGold)" opacity="0.7"/>
    <polygon points="-65,40 0,20 -30,-25" fill="url(#facetPure)" opacity="0.85"/>
    <polygon points="65,40 0,20 30,-25" fill="url(#facetPrismBlue)" opacity="0.85"/>

    <!-- Corner Chamfers of Radiant Cut -->
    <polygon points="-145,-90 -120,-115 -130,-125 -155,-100" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <polygon points="145,-90 120,-115 130,-125 155,-100" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>

    <!-- PRONGS (Platinum Claw Prongs with polished tips) -->
    <g id="clawProngs">
      <!-- Top Left -->
      <path d="M -135,-128 L -115,-108 L -125,-98 L -145,-118 Z" fill="url(#platBand)" stroke="#475569" stroke-width="1.2"/>
      <circle cx="-125" cy="-113" r="3.5" fill="#FFFFFF"/>
      
      <!-- Top Right -->
      <path d="M 135,-128 L 115,-108 L 125,-98 L 145,-118 Z" fill="url(#platBand)" stroke="#475569" stroke-width="1.2"/>
      <circle cx="125" cy="-113" r="3.5" fill="#FFFFFF"/>

      <!-- Bottom Left -->
      <path d="M -102,45 L -85,62 L -95,72 L -112,55 Z" fill="url(#platBand)" stroke="#475569" stroke-width="1.2"/>
      <circle cx="-94" cy="58" r="3.5" fill="#FFFFFF"/>

      <!-- Bottom Right -->
      <path d="M 102,45 L 85,62 L 95,72 L 112,55 Z" fill="url(#platBand)" stroke="#475569" stroke-width="1.2"/>
      <circle cx="94" cy="58" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Diamond Brilliant Sparkles & Lens Flares -->
    <!-- Top-left sparkle star -->
    <g transform="translate(-85, -75)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="0" y1="-25" x2="0" y2="25" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#BAE6FD" stroke-width="1"/>
      <line x1="-12" y1="12" x2="12" y2="-12" stroke="#BAE6FD" stroke-width="1"/>
    </g>

    <!-- Center sparkle star -->
    <g transform="translate(15, -20)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Right facet sparkle -->
    <g transform="translate(75, 25)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#FDE68A" stroke-width="0.8"/>
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#FDE68A" stroke-width="0.8"/>
    </g>
  </g>
</svg>
