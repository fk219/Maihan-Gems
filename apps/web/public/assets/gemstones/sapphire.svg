<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sapphireBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="42%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C0"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#sapphireBg)"/>

  <!-- Outer Cushion Girdle -->
  <g filter="url(#shadow)">
    <!-- Base Body -->
    <path d="M120 70 C160 62 240 62 280 70 C338 110 338 190 330 250 C300 310 240 338 200 338 C160 338 100 310 70 250 C62 190 62 110 120 70 Z" fill="url(#glow)"/>

    <!-- Pavilion & Crown Facets -->
    <!-- Table -->
    <polygon points="140,110 260,110 290,160 270,230 130,230 110,160" fill="#3B82F6" opacity="0.65"/>
    <polygon points="155,125 245,125 265,160 250,215 150,215 135,160" fill="#60A5FA" opacity="0.45"/>

    <!-- Corner Star Facets -->
    <polygon points="120,70 140,110 110,160 70,130" fill="url(#facetHighlight)" opacity="0.8"/>
    <polygon points="280,70 260,110 290,160 330,130" fill="#2563EB" opacity="0.75"/>
    <polygon points="270,230 290,160 330,250 280,300" fill="#1E3A8A" opacity="0.85"/>
    <polygon points="130,230 110,160 70,250 120,300" fill="#1D4ED8" opacity="0.8"/>

    <!-- Top & Bottom Kites -->
    <polygon points="140,110 200,80 260,110 200,125" fill="#93C5FD" opacity="0.75"/>
    <polygon points="130,230 200,215 270,230 200,310" fill="#1E40AF" opacity="0.85"/>

    <!-- Center Flash Reflection -->
    <polygon points="175,135 225,135 210,185 190,185" fill="#DBEAFE" opacity="0.6"/>

    <!-- Prongs at 4 Corners -->
    <circle cx="105" cy="85" r="7" fill="url(#goldGleam)"/>
    <circle cx="295" cy="85" r="7" fill="url(#goldGleam)"/>
    <circle cx="105" cy="275" r="7" fill="url(#goldGleam)"/>
    <circle cx="295" cy="275" r="7" fill="url(#goldGleam)"/>
  </g>
</svg>
