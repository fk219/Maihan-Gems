<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="haloBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="platinumShank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="gemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="haloShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#475569" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#haloBg)"/>

  <g filter="url(#haloShadow)">
    <!-- Ring Band (Platinum 950 Shank with Pavé Accents) -->
    <ellipse cx="200" cy="235" rx="105" ry="105" fill="none" stroke="url(#platinumShank)" stroke-width="20"/>
    <ellipse cx="200" cy="235" rx="95" ry="95" fill="none" stroke="#475569" stroke-width="2" opacity="0.4"/>

    <!-- Micro-Pavé Diamonds on Shoulders -->
    <circle cx="130" cy="180" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="145" cy="165" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="160" cy="150" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="270" cy="180" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="255" cy="165" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="240" cy="150" r="3.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>

    <!-- Halo Rim with Surrounding Pavé Diamond Points -->
    <ellipse cx="200" cy="95" rx="55" ry="40" fill="none" stroke="url(#platinumShank)" stroke-width="12"/>
    <ellipse cx="200" cy="95" rx="55" ry="40" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="4,6"/>

    <!-- Center Gemstone Mount -->
    <ellipse cx="200" cy="95" rx="38" ry="26" fill="url(#gemGlow)"/>

    <!-- Prongs -->
    <circle cx="170" cy="78" r="4.5" fill="#FFFFFF"/>
    <circle cx="230" cy="78" r="4.5" fill="#FFFFFF"/>
    <circle cx="170" cy="112" r="4.5" fill="#FFFFFF"/>
    <circle cx="230" cy="112" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>
