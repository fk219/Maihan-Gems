# pnpm workspace definition.
#
# Authority: INITIAL_IMPLEMENTATION_PLAN.md section 5, technical_design/03.
# The package set is exactly the layout the architecture specifies. No package
# may be added or renamed without an ADR (AGENTS.md section 6, prohibition 5).
#
# Deliberately excluded from this list:
#   - e2e/, tests/   spec directories, not workspace packages. Their runner is
#                   OPEN under ADR-021 and may not contain a test.
#   - docs/          documentation only, no manifest.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# pnpm build-script approval. esbuild (a transitive dependency of Drizzle Kit,
# the approved migration tooling per SKILL_MATRIX_AND_TOOLING.md section 14.1)
# needs its install script allowed; without it pnpm refuses a frozen-lockfile
# install. No other package builds scripts.
allowBuilds:
  esbuild: true

# ADR-031 — Sileo declares `motion ^12.34.0`; this app already ships motion
# ^14.5.0. Sileo imports only the `motion` proxy (`motion.rect`), which is
# unchanged across the two majors, so the transitive copy is pinned to the
# app's range. One motion in the bundle instead of two; no new package.
overrides:
  sileo>motion: ^14.5.0
