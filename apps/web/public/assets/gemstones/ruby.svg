<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="rubyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rubyGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="35%" stop-color="#EF4444"/>
      <stop offset="70%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>
    <linearGradient id="rubyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECACA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#DC2626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C0"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#450a0a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#rubyBg)"/>

  <g filter="url(#shadow)">
    <!-- Oval Ruby Base -->
    <ellipse cx="200" cy="200" rx="135" ry="150" fill="url(#rubyGlow)"/>

    <!-- Brilliant Oval Table -->
    <ellipse cx="200" cy="190" rx="80" ry="90" fill="#DC2626" opacity="0.6"/>
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="#EF4444" opacity="0.45"/>

    <!-- Radial Oval Star Facets -->
    <polygon points="200,50 170,110 230,110" fill="url(#rubyFacet)"/>
    <polygon points="200,350 170,290 230,290" fill="#7F1D1D" opacity="0.75"/>
    <polygon points="65,200 120,170 120,230" fill="#B91C1C" opacity="0.65"/>
    <polygon points="335,200 280,170 280,230" fill="#991B1B" opacity="0.7"/>

    <!-- Diagonal Kites -->
    <polygon points="105,95 155,125 125,165 75,135" fill="#F87171" opacity="0.6"/>
    <polygon points="295,95 245,125 275,165 325,135" fill="#DC2626" opacity="0.5"/>
    <polygon points="105,305 155,275 125,235 75,265" fill="#450A0A" opacity="0.8"/>
    <polygon points="295,305 245,275 275,235 325,265" fill="#7F1D1D" opacity="0.75"/>

    <!-- Center Glint -->
    <polygon points="180,150 220,150 205,185 195,185" fill="#FEE2E2" opacity="0.65"/>

    <!-- Prongs -->
    <circle cx="110" cy="90" r="7" fill="url(#goldGleam)"/>
    <circle cx="290" cy="90" r="7" fill="url(#goldGleam)"/>
    <circle cx="110" cy="310" r="7" fill="url(#goldGleam)"/>
    <circle cx="290" cy="310" r="7" fill="url(#goldGleam)"/>
  </g>
</svg>
