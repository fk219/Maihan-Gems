<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="emeraldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldBody" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="emeraldTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C0"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#022c22" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#emeraldBg)"/>

  <g filter="url(#shadow)">
    <!-- Octagonal Emerald Cut Outer Border -->
    <polygon points="120,60 280,60 340,120 340,280 280,340 120,340 60,280 60,120" fill="url(#emeraldBody)"/>

    <!-- Stepped Crown Facets -->
    <polygon points="135,85 265,85 315,135 315,265 265,315 135,315 85,265 85,135" fill="#047857" opacity="0.6"/>

    <!-- Emerald Table (Center Plane) -->
    <polygon points="150,110 250,110 290,150 290,250 250,290 150,290 110,250 110,150" fill="url(#emeraldTable)"/>

    <!-- Concentric Step Lines -->
    <!-- Corner Step Cuts -->
    <polygon points="120,60 135,85 85,135 60,120" fill="#6EE7B7" opacity="0.65"/>
    <polygon points="280,60 265,85 315,135 340,120" fill="#10B981" opacity="0.5"/>
    <polygon points="340,280 315,265 265,315 280,340" fill="#064E3B" opacity="0.8"/>
    <polygon points="60,280 85,265 135,315 120,340" fill="#065F46" opacity="0.75"/>

    <!-- Specular Jardin Flare -->
    <polygon points="170,130 230,130 210,180 190,180" fill="#A7F3D0" opacity="0.55"/>

    <!-- Corner Prongs -->
    <circle cx="118" cy="65" r="6" fill="url(#goldGleam)"/>
    <circle cx="282" cy="65" r="6" fill="url(#goldGleam)"/>
    <circle cx="335" cy="122" r="6" fill="url(#goldGleam)"/>
    <circle cx="335" cy="278" r="6" fill="url(#goldGleam)"/>
    <circle cx="282" cy="335" r="6" fill="url(#goldGleam)"/>
    <circle cx="118" cy="335" r="6" fill="url(#goldGleam)"/>
    <circle cx="65" cy="278" r="6" fill="url(#goldGleam)"/>
    <circle cx="65" cy="122" r="6" fill="url(#goldGleam)"/>
  </g>
</svg>
