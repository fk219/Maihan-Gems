<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="earBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldShank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C0"/>
      <stop offset="40%" stop-color="#E8C96A"/>
      <stop offset="80%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="rubyGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="earShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#8b6914" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#earBg)"/>

  <g filter="url(#earShadow)">
    <!-- Earring 1 (Left) -->
    <g transform="translate(110, 160)">
      <circle cx="0" cy="-30" r="14" fill="none" stroke="url(#goldShank)" stroke-width="4"/>
      <line x1="0" y1="-16" x2="0" y2="0" stroke="url(#goldShank)" stroke-width="5"/>
      <circle cx="0" cy="30" r="38" fill="none" stroke="url(#goldShank)" stroke-width="6"/>
      <!-- Gemstone -->
      <circle cx="0" cy="30" r="32" fill="url(#rubyGleam)"/>
      <circle cx="-22" cy="15" r="4" fill="url(#goldShank)"/>
      <circle cx="22" cy="15" r="4" fill="url(#goldShank)"/>
      <circle cx="-22" cy="45" r="4" fill="url(#goldShank)"/>
      <circle cx="22" cy="45" r="4" fill="url(#goldShank)"/>
    </g>

    <!-- Earring 2 (Right - Matched Pair) -->
    <g transform="translate(290, 160)">
      <circle cx="0" cy="-30" r="14" fill="none" stroke="url(#goldShank)" stroke-width="4"/>
      <line x1="0" y1="-16" x2="0" y2="0" stroke="url(#goldShank)" stroke-width="5"/>
      <circle cx="0" cy="30" r="38" fill="none" stroke="url(#goldShank)" stroke-width="6"/>
      <!-- Gemstone -->
      <circle cx="0" cy="30" r="32" fill="url(#rubyGleam)"/>
      <circle cx="-22" cy="15" r="4" fill="url(#goldShank)"/>
      <circle cx="22" cy="15" r="4" fill="url(#goldShank)"/>
      <circle cx="-22" cy="45" r="4" fill="url(#goldShank)"/>
      <circle cx="22" cy="45" r="4" fill="url(#goldShank)"/>
    </g>
  </g>
</svg>
